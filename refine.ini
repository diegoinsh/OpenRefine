# NOTE: This file is not read if you run the Refine executable directly
# It is only read of you use the refine shell script or refine.bat

# FOR DEVELOPERS: you can copy refine.ini and rename it to refine-dev.ini
# Configurations in refine.ini will be ignored if refine-dev.ini exists
# refine-dev.ini won't be tracked by Git, so feel free to put your custom configurations in it

no_proxy="localhost,127.0.0.1"
#REFINE_PORT=3334
#REFINE_INTERFACE=127.0.0.1
#REFINE_HOST=mymachine.local

#REFINE_WEBAPP=main\webapp

# Maximum JVM heap (memory) and the container's max form content size (bytes, default 64MB)
#REFINE_CONTAINER_MAX_POST_SIZE=67108864
REFINE_MEMORY=4096M

# Initial (and minimum) size of Java heap
REFINE_MIN_MEMORY=1048M

# Some sample configurations. These have no defaults.
#JAVA_HOME=C:\Program Files\Java\jdk1.8.0_151
# Use a single JAVA_OPTIONS that includes any JVM options you need upon JinRefine startup
#JAVA_OPTIONS=-XX:+UseParallelGC -verbose:gc -Drefine.headless=true -Drefine.data_dir=C:\Users\user\AppData\Roaming\JinRefine -Drefine.display.new.version.notice=true

# JVM optimization for large-scale image processing (百万级图片处理优化)
# G1 Garbage Collector for better performance with large heaps
# Java 21 compatible GC logging options
JAVA_OPTIONS=-XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:G1HeapRegionSize=16m -Xlog:gc*:stdout:time -Drefine.headless=true

# 开发态默认免狗（开发树 ruyi.license.enforce=off）。
# 要在开发时验证加密狗（读狗 + 模块授权），在 JAVA_OPTIONS 里追加 -Druyi.license.dog=true；
# 读狗桥不在默认探测路径时再加 -Druyi.license.bridge=<dog_read.exe 绝对路径>。
# 发布态忽略该开关，恒定先读狗、未授权即拒绝（无豁免）。

# Uncomment to increase autosave period to 60 mins (default: 5 minutes)
# for better performance of long-lasting transformations (but increased risk of data loss)
#REFINE_AUTOSAVE_PERIOD=60
