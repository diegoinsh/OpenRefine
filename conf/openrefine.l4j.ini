# Launch4j runtime config

# initial memory heap size
# 部署版由 Launch4j 的 jinrefine.exe 启动，只读本文件；refine.ini 的 REFINE_MEMORY
# 在「用 exe 直启」时不生效（refine.ini 首行有说明）。原 -Xmx1024M 使 OpenRefine
# 堆仅 1GB（实测部署日志 "JVM Max heap: 1024.0 MBytes"），处理大 project 时频繁
# Full GC，前端轮询出现 60s 周期性超时。此处对齐 refine.ini 的 4096M。
-Xms4096M

# max memory memory heap size
-Xmx4096M

# Use system defined HTTP proxies
-Drefine.headless=true
-Djava.net.useSystemProxies=true
# You should probably define the properties below, if they are not already 
# defined in the environment variable JAVA_TOOL_OPTIONS.
# Refer to the Java documentation (for example, at
# https://docs.oracle.com/javase/8/docs/api/java/net/doc-files/net-properties.html
# for the precise meaning of each option)
#-Dhttp.proxyHost=myproxy.mydomain.org
#-Dhttp.proxyPort=8080
#-Dhttps.proxyHost=myproxy.mydomain.org
#-Dhttps.proxyPort=8080
#-Dhttp.nonProxyHosts="*.mydomain.org|localhost|127.*"

#-XX:+UseLargePages
#-Dsomevar="%SOMEVAR%"

# Virbox Java BCE agent - required to load protected server jar
#-javaagent:server/target/lib/sjt_agent.jar
