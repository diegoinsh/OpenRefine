<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!--
    OCR 拉框十字光标（可直接改数值微调）：
    - width / height：光标整体大小，当前 16px（系统默认 crosshair 约 32px，即小一半）；
      不建议超过 32，部分浏览器会直接忽略过大的光标图。
    - 第一组 line 的 stroke-width：白色衬边宽度，保证在深色底图上也能看清；不需要衬边就删掉整组 <g>。
    - 第二组 line 的 stroke-width：主线粗细，1 已是最细的整数像素线（再小会发虚）；
      想更轻可把颜色改浅（如 #555）或加 opacity。
    - 改动大小后，记得同步 file-view-panel.css 里 url(...) 后面的热点坐标（当前 8 8，即图片中心）。
  -->
  <g stroke="#ffffff" stroke-width="3" opacity="0.55">
    <line x1="8.5" y1="0.5" x2="8.5" y2="15.5" />
    <line x1="0.5" y1="8.5" x2="15.5" y2="8.5" />
  </g>
  <g stroke="#1a1a1a" stroke-width="1">
    <line x1="8.5" y1="0.5" x2="8.5" y2="15.5" />
    <line x1="0.5" y1="8.5" x2="15.5" y2="8.5" />
  </g>
</svg>
